source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

# Time
label {
    text = $TIME
    color = $on_surface
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    rounding = 12
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    placeholder_text = Password
    fail_text = Wrong password
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Flirps OS branding
label {
    text = Flirps OS
    color = $primary
    font_size = 16
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 40
    halign = center
    valign = bottom
}
label {
    text = Hi, $USER
    color = $on_surface_variant
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}

# Per-machine overrides written by install.sh (e.g. VM tweaks); gitignored. If it's
# missing (configs pulled without re-running install.sh) hyprlock logs it and carries on.
source = ~/.config/hypr/config/machine-hyprlock.conf
