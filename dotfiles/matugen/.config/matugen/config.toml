[config]

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/theme.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/theme.css"

[templates.qt]
input_path = "~/.config/matugen/templates/qt.conf"
output_path = "~/.config/qt6ct/colors/wallpaper.conf"

[templates.waterfox]
input_path = "~/.config/matugen/templates/waterfox.css"
output_path = "~/.waterfox/4yxlttdl.default-release/chrome/colors.css"

[templates.hypr]
input_path = "~/.config/matugen/templates/hypr-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell.json"
output_path = "~/.config/quickshell/settings/colors.json"
